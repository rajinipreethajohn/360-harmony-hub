<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Netlify Forms</title>
  </head>
  <body>
    <form name="harmony-newsletter-subscribe" method="POST" action="/forms.html" data-netlify="true" data-netlify-honeypot="bot-field">
      <input type="hidden" name="form-name" value="harmony-newsletter-subscribe" />
      <p style="display: none;">
        <label>Do not fill this out if you are human: <input name="bot-field" /></label>
      </p>
      <input name="name" type="text" />
      <input name="email" type="email" />
    </form>
  </body>
</html>
